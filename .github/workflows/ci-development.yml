name: CI — Development

# Triggers on every push/PR to develop branch
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  ci:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Setup Node ─────────────────────────────────────────────────────────
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Lint ───────────────────────────────────────────────────────────────
      - name: Lint
        run: npx eslint "src/**/*.ts"

      # ── 5. TypeScript compile check (no emit) ─────────────────────────────────
      - name: Type-check
        run: npx tsc --noEmit

      # ── 6. Build ──────────────────────────────────────────────────────────────
      - name: Build
        run: npm run build

      # ── 7. Docker build check (no push) ───────────────────────────────────────
      - name: Docker build check
        run: docker build -f Dockerfile.dev -t kinedeo-api:dev-check .
